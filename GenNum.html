<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate MP3 Numbers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
      font-size: 18px;
    }
    label {
      font-weight: bold;
      margin-top: 15px;
    }
    input {
      padding: 10px;
      font-size: 18px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      padding: 12px;
      font-size: 18px;
      margin-top: 10px;
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    #result {
      margin-top: 20px;
      background: #fff;
      border: 1px solid #ccc;
      padding: 15px;
      font-size: 18px;
      min-height: 60px;
      border-radius: 5px;
      word-wrap: break-word;
    }
    #count {
      margin-top: 10px;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>MP3 Filename Generator</h2>

  <label for="startNum">Start#</label>
  <input type="number" id="startNum" placeholder="e.g. 15" oninput="updateEndNum()">

  <label for="incNum">Inc#</label>
  <input type="number" id="incNum" placeholder="e.g. 5" oninput="updateEndNum()">

  <label for="endNum">End#</label>
  <input type="number" id="endNum" placeholder="e.g. 20" oninput="updateIncNum()">

  <button onclick="generateMP3List()">Generate</button>

  <div id="result"></div>

  <button onclick="copyToClipboard()">Copy</button>

  <div id="count"></div>

  <script>
    function updateEndNum() {
      const start = parseFloat(document.getElementById('startNum').value);
      const inc = parseFloat(document.getElementById('incNum').value);
      if (!isNaN(start) && !isNaN(inc)) {
        document.getElementById('endNum').value = start + inc;
      }
    }

    function updateIncNum() {
      const start = parseFloat(document.getElementById('startNum').value);
      const end = parseFloat(document.getElementById('endNum').value);
      if (!isNaN(start) && !isNaN(end)) {
        document.getElementById('incNum').value = end - start;
      }
    }

    function generateMP3List() {
      let start = parseInt(document.getElementById('startNum').value);
      let inc = parseInt(document.getElementById('incNum').value);
      let end = parseInt(document.getElementById('endNum').value);
      const resultDiv = document.getElementById('result');
      const countDiv = document.getElementById('count');

      if (isNaN(end) && !isNaN(start) && !isNaN(inc)) {
        end = start + inc;
        document.getElementById('endNum').value = end;
      } else if (isNaN(inc) && !isNaN(start) && !isNaN(end)) {
        inc = end - start;
        document.getElementById('incNum').value = inc;
      }

      if (isNaN(start) || isNaN(end) || start > end) {
        resultDiv.textContent = "Please enter valid numbers (start ≤ end).";
        countDiv.textContent = "";
        return;
      }

      let output = '[';
      for (let i = start; i <= end; i++) {
        output += `"${i}.mp3", `;
      }
      output = output.slice(0, -2) + "]";
      resultDiv.textContent = output;
      countDiv.textContent = `Total: ${end - start + 1} files`;
    }

    function copyToClipboard() {
      const text = document.getElementById('result').textContent;
      if (!text || text.startsWith("Please enter")) {
        alert("Nothing to copy! Please generate the list first.");
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("Copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }
  </script>
</body>
</html>
