<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生日 &amp; 日曆</title>
<style>
  :root{
    --paper: #f6f1de;
    --ink-green: #1f5c3d;
    --ink-green-dark: #143d29;
    --ink-red: #a8352b;
    --ink-red-dark: #7a231b;
    --line: #8a8265;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ece6d2;
    font-family: "PingFang TC", "Heiti TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }

  .page {
    min-height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(20px, 4vw, 56px);
    padding: clamp(20px, 4vw, 56px);
    flex-wrap: wrap;
  }

  /* ---------- Left: static birthday table ---------- */
  .table-wrap {
    background: var(--paper);
    border: 2px solid #4a4530;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    flex: 1 1 480px;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
  }

  table.birthdays {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(16px, 2.2vw, 20px);
  }

  table.birthdays th, table.birthdays td {
    border: 1px solid var(--line);
    padding: 14px 18px;
    vertical-align: top;
    color: #3a3624;
  }

  table.birthdays th {
    text-align: center;
    font-size: clamp(22px, 3vw, 28px);
    font-weight: 700;
    letter-spacing: 0.15em;
    background: rgba(31,92,61,0.06);
  }

  table.birthdays td:first-child {
    width: 34%;
    font-weight: 600;
    line-height: 2;
    white-space: pre-line;
  }

  table.birthdays td:last-child {
    line-height: 2;
    white-space: pre-line;
  }

  table.birthdays tbody tr:not(:last-child) td {
    border-bottom: 2px solid #4a4530;
  }

  /* ---------- Right: calendar ---------- */
  .calendar {
    --accent: var(--ink-green);
    --accent-dark: var(--ink-green-dark);
    flex: 0 0 auto;
    width: clamp(340px, 38vw, 480px);
    max-width: 520px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    background: var(--paper);
    border: 3px solid var(--accent);
    border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    color: var(--accent);
    padding: clamp(18px, 3vw, 34px) clamp(16px, 3vw, 32px) clamp(30px, 5vw, 50px);
    text-align: center;
    transition: color 0.3s, border-color 0.3s;
  }

  .calendar.sunday {
    --accent: var(--ink-red);
    --accent-dark: var(--ink-red-dark);
  }

  .cal-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 2px solid var(--accent);
    border-radius: 4px;
    padding: 8px 10px;
    font-weight: 700;
  }

  .cal-topbar .ornament {
    font-size: 20px;
    line-height: 1;
    opacity: 0.85;
  }

  .cal-topbar .year {
    font-size: clamp(20px, 2.8vw, 28px);
    letter-spacing: 0.05em;
  }

  .cal-topbar .month {
    font-size: clamp(22px, 3.1vw, 30px);
    letter-spacing: 0.1em;
  }

  .cal-day {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    font-size: clamp(120px, 24vw, 320px);
    font-weight: 900;
    line-height: 1;
    margin: 24px 0 36px;
    font-family: "Songti TC", "STSong", "Noto Serif TC", serif;
  }

  .cal-weekday-box, .cal-lunar-box {
    border: 2px solid var(--accent);
    border-radius: 4px;
    padding: 14px 10px;
    margin-top: 20px;
    position: relative;
    flex: 0 0 auto;
  }

  .cal-weekday {
    font-size: clamp(24px, 3.2vw, 32px);
    font-weight: 700;
    letter-spacing: 0.2em;
  }

  .cal-lunar {
    font-size: clamp(20px, 2.6vw, 26px);
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .cal-nav {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 3vw, 34px);
    margin-top: 26px;
  }

  .cal-nav-btn {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 50%;
    width: clamp(44px, 6vw, 56px);
    height: clamp(44px, 6vw, 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .cal-nav-btn svg {
    width: 55%;
    height: 55%;
  }

  .cal-nav-btn:active {
    transform: scale(0.92);
    background-color: var(--accent);
    color: var(--paper);
  }

  .cal-nav-home {
    width: clamp(50px, 7vw, 64px);
    height: clamp(50px, 7vw, 64px);
    background-color: var(--accent);
    color: var(--paper);
  }

  .cal-nav-home:active {
    background-color: var(--accent-dark);
    border-color: var(--accent-dark);
    color: var(--paper);
  }

  @media (hover: hover) {
    .cal-nav-btn:hover {
      background-color: var(--accent);
      color: var(--paper);
    }
    .cal-nav-home:hover {
      background-color: var(--accent-dark);
      border-color: var(--accent-dark);
    }
  }

  /* decorative corner brackets, echoing the traditional tear-off calendar look */
  .corner-deco {
    position: relative;
  }
  .corner-deco::before, .corner-deco::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent);
    top: 4px;
  }
  .corner-deco::before { left: 4px; border-right: none; border-bottom: none; }
  .corner-deco::after { right: 4px; border-left: none; border-bottom: none; }

  @media (max-width: 640px) {
    .page { flex-direction: column; align-items: center; }
    .calendar { width: min(90vw, 420px); height: auto !important; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- ============ Left: static birthday table (do not change) ============ -->
  <div class="table-wrap">
    <table class="birthdays">
      <thead>
        <tr>
          <th></th>
          <th>生日</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>大偉
秀芬
峻文</td>
          <td>9月23日 (農曆 八月初九)
11月16日
5月8日</td>
        </tr>
        <tr>
          <td>君美
威廉
仔仔(Eddie)
妹妹 (Rachel)</td>
          <td>10月12日 (農曆 九月初九)
7月13日
5月6日
3月31日</td>
        </tr>
        <tr>
          <td>偉鳴
潔明
柏熹</td>
          <td>7月25日 (農曆 六月十二)
6月2日
8月27日</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ============ Right: dynamic calendar ============ -->
  <div class="calendar" id="calendar">
    <div class="cal-topbar corner-deco">
      <span class="ornament">卍</span>
      <span class="year" id="cal-year"></span>
      <span class="month" id="cal-month"></span>
      <span class="ornament">卍</span>
    </div>
    <div class="cal-day" id="cal-day"></div>
    <div class="cal-weekday-box">
      <div class="cal-weekday" id="cal-weekday"></div>
    </div>
    <div class="cal-lunar-box">
      <div class="cal-lunar" id="cal-lunar"></div>
    </div>
    <div class="cal-nav">
      <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="前一天">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="cal-nav-btn cal-nav-home" id="cal-home" aria-label="回到今天">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 L12 4.5 L20 11.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10 V19 H18 V10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19 V14 H14 V19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="cal-nav-btn" id="cal-next" aria-label="後一天">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 5 L16 12 L9 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
/* ---------------------------------------------------------------------
   Lunar (農曆) conversion — classic 1900-2100 lunarInfo table algorithm.
   Self-contained, no external dependency, works fully offline.
--------------------------------------------------------------------- */
const lunarInfo = [
0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
0x0d520
];

const solarMonthDays = [31,28,31,30,31,30,31,31,30,31,30,31];

function lYearDays(y){
  let sum = 348;
  for(let i=0x8000;i>0x8;i>>=1){
    sum += (lunarInfo[y-1900] & i) ? 1 : 0;
  }
  return sum + leapDays(y);
}
function leapMonth(y){ return lunarInfo[y-1900] & 0xf; }
function leapDays(y){
  if(leapMonth(y)) return (lunarInfo[y-1900] & 0x10000) ? 30 : 29;
  return 0;
}
function monthDays(y,m){
  return (lunarInfo[y-1900] & (0x10000 >> m)) ? 30 : 29;
}

const nStr1 = ["日","一","二","三","四","五","六","七","八","九","十"];
const nStr2 = ["初","十","廿","三十"];

function lunarMonthName(m, isLeap){
  let name = (m===1)?"正":(m===11)?"十一":(m===12)?"十二":
             (m<=10)? nStr1[m] : "十"+nStr1[m-10];
  // build proper names 1-12
  const names = ["","正","二","三","四","五","六","七","八","九","十","十一","十二"];
  name = names[m];
  return (isLeap? "閏":"") + name + "月";
}
function lunarDayName(d){
  if(d===10) return "初十";
  if(d===20) return "二十";
  if(d===30) return "三十";
  const tens = Math.floor(d/10);
  const ones = d%10;
  return nStr2[tens] + nStr1[ones];
}

// Convert a JS Date (solar) to lunar {year, month, day, isLeap}
function getLunar(date){
  const baseUTC = Date.UTC(1900,0,31);
  const targetUTC = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
  let offset = Math.floor((targetUTC - baseUTC) / 86400000);

  let year = 1900;
  let temp = 0;
  for(; year < 2101; year++){
    temp = lYearDays(year);
    if(offset < temp) break;
    offset -= temp;
  }

  const leap = leapMonth(year);
  let isLeap = false;
  let month = 1;
  for(; month < 13; month++){
    if(leap > 0 && month === leap + 1 && !isLeap){
      month--;
      isLeap = true;
      temp = leapDays(year);
    } else {
      temp = monthDays(year, month);
    }
    if(offset < temp) break;
    offset -= temp;
    if(isLeap && month === leap + 1){
      isLeap = false;
    }
  }

  const day = offset + 1;
  return { year, month, day, isLeap };
}

function formatLunarDate(date){
  const l = getLunar(date);
  return "農曆" + lunarMonthName(l.month, l.isLeap) + lunarDayName(l.day);
}

/* ---------------------------------------------------------------------
   Render the currently viewed date into the calendar widget.
   `viewDate` is the date on display; it starts as today, but the user
   can step it forward/back with the arrows, or snap back with Home.
--------------------------------------------------------------------- */
const monthNamesCh = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const weekdayCh = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

let viewDate = new Date();
let followingToday = true; // false once the user navigates away from today

function isSameDay(a, b){
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function renderCalendar(){
  const now = viewDate;
  const dow = now.getDay(); // 0 = Sunday

  document.getElementById('cal-year').textContent = now.getFullYear();
  document.getElementById('cal-month').textContent = monthNamesCh[now.getMonth()];
  document.getElementById('cal-day').textContent = now.getDate();
  document.getElementById('cal-weekday').textContent = weekdayCh[dow];
  document.getElementById('cal-lunar').textContent = formatLunarDate(now);

  const calEl = document.getElementById('calendar');
  if(dow === 0){
    calEl.classList.add('sunday');
  } else {
    calEl.classList.remove('sunday');
  }
}

function goToPrevDay(){
  viewDate = new Date(viewDate);
  viewDate.setDate(viewDate.getDate() - 1);
  followingToday = false;
  renderCalendar();
}

function goToNextDay(){
  viewDate = new Date(viewDate);
  viewDate.setDate(viewDate.getDate() + 1);
  followingToday = false;
  renderCalendar();
}

function goToToday(){
  viewDate = new Date();
  followingToday = true;
  renderCalendar();
}

document.getElementById('cal-prev').addEventListener('click', goToPrevDay);
document.getElementById('cal-next').addEventListener('click', goToNextDay);
document.getElementById('cal-home').addEventListener('click', goToToday);

renderCalendar();

// While the user hasn't navigated away, keep the view in sync with the
// real date (so the page stays correct if left open across midnight).
setInterval(() => {
  if(followingToday){
    const realNow = new Date();
    if(!isSameDay(viewDate, realNow)){
      viewDate = realNow;
      renderCalendar();
    }
  }
}, 60 * 1000);

/* ---------------------------------------------------------------------
   Match the birthday table's height to the calendar's rendered height,
   without changing the calendar's own natural size in any way.
--------------------------------------------------------------------- */
function syncTableHeight(){
  const tableWrap = document.querySelector('.table-wrap');
  const calendar = document.getElementById('calendar');
  if(!tableWrap || !calendar) return;

  // On narrow/stacked layouts (see the max-width:640px rule) let the
  // table size itself naturally instead of matching the calendar.
  if(window.matchMedia('(max-width: 640px)').matches){
    tableWrap.style.height = '';
    return;
  }

  tableWrap.style.height = calendar.offsetHeight + 'px';
}

window.addEventListener('load', syncTableHeight);
window.addEventListener('resize', syncTableHeight);
window.addEventListener('orientationchange', syncTableHeight);

if('ResizeObserver' in window){
  const calendarEl = document.getElementById('calendar');
  if(calendarEl){
    const ro = new ResizeObserver(syncTableHeight);
    ro.observe(calendarEl);
  }
}

syncTableHeight();
</script>
</body>
</html>
